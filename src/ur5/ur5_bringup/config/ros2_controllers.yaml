controller_manager:
  ros__parameters:
    # All joint names use the left_ prefix set in the URDF tf_prefix.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # UR-specific extras (GPIO, speed scaling, F/T sensor)
    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    # Arm trajectory controllers
    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Gripper trajectory controller
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Robotiq activation (needed once after power-up on real hardware)
    robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

    freedrive_mode_controller:
      type: ur_controllers/FreedriveModeController

    # Prevent command clamping issues with position control on Kilted
    enforce_command_limits: false


# ===== Arm controllers =====

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    command_interfaces: [position]
    state_interfaces:   [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    speed_scaling_interface_name: left_speed_scaling/speed_scaling_factor
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    command_interfaces: [position]
    state_interfaces:   [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false


# ===== Gripper controller =====

gripper_controller:
  ros__parameters:
    joints:
      - left_robotiq_85_left_knuckle_joint
    command_interfaces: [position]
    state_interfaces:   [position]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0


# ===== UR extras =====

io_and_status_controller:
  ros__parameters:
    tf_prefix: "left_"

speed_scaling_state_broadcaster:
  ros__parameters:
    tf_prefix: "left_"
    state_publish_rate: 100.0

freedrive_mode_controller:
  ros__parameters:
    tf_prefix: "left_"

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: left_tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: left_tool0
    topic_name: ft_data
